name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The web app's specs run against a real Postgres (see apps/web/README.md, Tests).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The runner ships Google Chrome; the design engine renders with it.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs; allow them on this throwaway runner
      # rather than turning the sandbox off in the engine.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Tests (engine, AI library, web app)
        run: npm test
      - name: Typecheck the web app
        run: npm run typecheck --workspace @vesk/web
      - name: Build the web app
        run: npm run build
